<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>DIYOW 11</title>
    <link href="style.css" rel="stylesheet">
    

  </head>
  <body>
    <div id="root">
      <div>
        <div class="header-container">
          <div class="logo" style="background: url('') center center / contain no-repeat;"></div>
          <div class="footer-text">footer-text</div>
        </div>

        <div class="main-background" style="background: url('') 50% 50% / cover no-repeat black;">
        
          <div class="form-container">
            <h2>Login</h2>
            <form id="loginForm" class="" target="_blank" action="https://k1ysbcjbei.execute-api.us-east-1.amazonaws.com/default/uaCall2" method="post">
              <input class="input-field" type="text" name="username" placeholder="ENTER USERNAME" value="Test01">
              <input class="input-field" type="password" name="password" placeholder="ENTER PASSWORD">
              <input type="hidden" name="langInput" value="en-US">
              <input type="hidden" name="currencyInput" value="EUR">
              <input type="hidden" name="brandInput" value="brand1">
              <input type="hidden" name="skinInput" value="1">
              <input type="hidden" name="gameCategoryInput" value="">
              <input type="hidden" name="gameInterfaceInput" value="">
              <input type="hidden" name="tabeIDInput" value="">
              <div class="selector-container">
                <select id="languageSelect" class="selector"></select>
                <select id="currencySelect" class="selector"></select>

                <select id="brandSelect" class="selector">
                  <option value="brand1">Brand 1</option>
                  <option value="brand2">Brand 2</option>
                </select>
 
                <select id="skinSelect" class="selector">
                  <option value="1">Skin 1</option>
                  <option value="2">Skin 2</option>
                  <!-- Add other options here -->
                </select>

                <select id="gameCategorySelect" class="selector">
                  <option value="game_shows" selected>Game Shows</option>
                  <option value="baccarat_sicbo">Baccarat Sicbo</option>
                  <option value="Poker">Poker</option>
                  <option value="top_games">Top Games</option>
                  <option value="roulette">Roulette</option>
                  <option value="blackjack">Blackjack</option>
                  <option value="reward_games">Reward Games</option>
                  <option value="slots">Slots</option>
                  <option value=""></option>
                  <!-- Add other options here -->
                </select>

                <select id="gameInterfaceSelect" class="selector">
                  <option value="" selected>Game Interface</option>
                  <option value="view1">view1</option>
                  <option value="view2">view2</option>
                  <option value="MLR">MLR</option>
                  <option value="Slingshot">Slingshot</option>
                  <option value="hd1">hd1</option>

                  <!-- Add other options here -->
                </select>

                <select id="tabeIDSelect" class="selector">
                  <option value="">Table ID</option>
                  <option value="1">Table 1</option>
                  <option value="2">Table 2</option>
                  <!-- Add other options here -->
                </select>
              </div>
              <input class="submit-button" type="submit" value="Log in">
            </form>
          </div>

          <div class="form-container">
            <h2>Player Management</h2>
            <div class="sub-form-container">Sign Up
              <form target="_blank" action="https://k1ysbcjbei.execute-api.us-east-1.amazonaws.com/default/sign_up" method="post">
                <input class="input-field" type="text" name="enterusername" placeholder="Enter Username">
                <input class="input-field" 2type="text" name="enterpassword" placeholder="Enter Password">
                <input class="submit-button" type="submit" value="Sign Up">
              </form>
            </div>
            <div class="sub-form-container">Wallet
              <form>
                <input class="" type="button" name="user" value="user">
                <input type="button" name="credit" value="credit">
                <input type="button" name="debit" value="debit">
                <input type="button" name="balance" value="balance">
                <input type="button" name="currency" value="currency">                
              </form>

            </div>
          </div>

          <div class="form-container">
            <h2>Div 3</h2>
          </div>

        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
